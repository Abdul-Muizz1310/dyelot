version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # react/react-dom and playwright/@playwright/test are each pinned to one
    # version and must be raised together. Ungrouped, dependabot opens a PR per
    # package and lifts half a pair, which fails in a way that never names the
    # cause: a react/react-dom skew breaks every component suite, and a
    # playwright skew reports "No tests found". Exact names, not prefixes, so
    # "react" cannot sweep in react-is.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      playwright:
        patterns:
          - "playwright"
          - "@playwright/test"
    ignore:
      # TypeScript 7 ships no JavaScript compiler API. Next 16.2 needed one;
      # Next 16.4 type-checks with the project's tsc CLI by default
      # (experimental.useTypeScriptCli), which its docs say enables TypeScript
      # 7 (checked 2026-11-01). Lift this ignore in a deliberate upgrade PR.
      - dependency-name: "typescript"
        versions: [">=7"]
